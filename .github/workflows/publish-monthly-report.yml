name: Publish Monthly Index Report

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 1 * *"

permissions:
  contents: write

concurrency:
  group: publish-monthly-index-report
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source data
        run: npm run validate

      - name: Generate monthly report
        run: npm run report:monthly

      - name: Commit report
        run: |
          if git diff --quiet -- reports/monthly; then
            echo "No monthly report changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/monthly
          git commit -m "docs(data): publish monthly index report"
          git push
