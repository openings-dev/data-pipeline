name: Discover Communities

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1"

permissions:
  contents: read
  issues: write

concurrency:
  group: discover-communities
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Validate repository
        run: node scripts/validate-repo.mjs

      - name: Discover community candidates
        id: discovery
        env:
          DISCOVERY_OUTPUT_DIR: ${{ runner.temp }}/community-discovery
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run discover:communities

      - name: Read report status
        id: report
        if: always()
        env:
          DISCOVERY_OUTPUT_DIR: ${{ runner.temp }}/community-discovery
        run: |
          if [ ! -f "$DISCOVERY_OUTPUT_DIR/report.json" ]; then
            echo "status=missing" >> "$GITHUB_OUTPUT"
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node -e 'const report=require(process.env.DISCOVERY_OUTPUT_DIR+"/report.json"); console.log(`status=${report.status}`); console.log(`count=${report.summary.qualifiedCandidates}`)' >> "$GITHUB_OUTPUT"
          cat "$DISCOVERY_OUTPUT_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: community-discovery
          path: ${{ runner.temp }}/community-discovery
          if-no-files-found: warn

      - name: Open review inbox
        if: steps.report.outputs.status == 'complete' && fromJSON(steps.report.outputs.count) > 0
        env:
          DISCOVERY_OUTPUT_DIR: ${{ runner.temp }}/community-discovery
          GH_TOKEN: ${{ github.token }}
        run: |
          existing="$(gh issue list --state open --search 'Community discovery inbox in:title' --json title --jq 'map(select(.title == "Community discovery inbox")) | length')"
          if [ "$existing" = "0" ]; then
            gh issue create --title "Community discovery inbox" --body-file "$DISCOVERY_OUTPUT_DIR/report.md"
          else
            echo "An open community discovery inbox already exists."
          fi

      - name: Enforce complete discovery
        if: always()
        run: |
          if [ "${{ steps.discovery.outcome }}" != "success" ] || [ "${{ steps.report.outputs.status }}" != "complete" ]; then
            echo "Community discovery did not finish completely."
            exit 1
          fi
