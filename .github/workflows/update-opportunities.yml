name: Update Opportunities Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"

permissions:
  contents: write

concurrency:
  group: update-opportunities-snapshot
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Validate repository
        run: npm run validate

      - name: Build opportunities snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAX_ISSUES_PER_REPOSITORY: "30"
          MAX_REPOSITORIES: "0"
          REQUEST_DELAY_MS: "120"
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: production
          SENTRY_MONITOR_SLUG: opportunities-sync
          SENTRY_RELEASE: ${{ github.sha }}
        run: npm run build:snapshot

      - name: Submit production publications
        if: vars.PUBLISHING_PRODUCTION_ENABLED == 'true'
        env:
          PUBLISHING_ENDPOINT: ${{ secrets.PUBLISHING_ENDPOINT }}
          PUBLISHING_CLIENT_ID: ${{ secrets.PUBLISHING_CLIENT_ID }}
          PUBLISHING_CLIENT_SECRET: ${{ secrets.PUBLISHING_CLIENT_SECRET }}
        run: npm run publish:production

      - name: Commit and push snapshot
        id: snapshot
        run: |
          if git diff --quiet -- snapshots/opportunities; then
            echo "No snapshot changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous_commit="$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots/opportunities
          git add snapshots/publishing
          git add -u snapshots
          git commit -m "chore(data): refresh segmented opportunities snapshot"
          source_commit="$(git rev-parse HEAD)"
          data_hash="$(node -p "JSON.parse(require('fs').readFileSync('snapshots/opportunities/api/manifest.json', 'utf8')).dataHash")"

          if [[ ! "$source_commit" =~ ^[0-9a-f]{40}$ || ! "$previous_commit" =~ ^[0-9a-f]{40}$ || ! "$data_hash" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Refusing to emit an invalid source event."
            exit 1
          fi

          for push_attempt in 1 2 3; do
            if git push; then
              {
                echo "changed=true"
                echo "source_commit=$source_commit"
                echo "previous_commit=$previous_commit"
                echo "data_hash=$data_hash"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "$push_attempt" -lt 3 ]; then
              echo "::warning::Snapshot push failed on attempt $push_attempt; retrying."
              sleep "$((push_attempt * 5))"
            fi
          done

          echo "::error::Snapshot push failed after 3 attempts."
          exit 1

      - name: Notify social publisher after successful push
        if: steps.snapshot.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SOCIAL_PUBLISHER_DISPATCH_TOKEN }}
          SOURCE_COMMIT: ${{ steps.snapshot.outputs.source_commit }}
          PREVIOUS_COMMIT: ${{ steps.snapshot.outputs.previous_commit }}
          DATA_HASH: ${{ steps.snapshot.outputs.data_hash }}
        run: |
          jq -n \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg previous_commit "$PREVIOUS_COMMIT" \
            --arg data_hash "$DATA_HASH" \
            '{
              event_type: "openings_source_committed_v1",
              client_payload: {
                schema_version: 1,
                source_repository: "openings-dev/data-pipeline",
                source_commit: $source_commit,
                previous_commit: $previous_commit,
                data_hash: $data_hash,
                event_id: ("openings:data:" + $source_commit)
              }
            }' | gh api --method POST repos/openings-dev/social-publisher/dispatches --input -
