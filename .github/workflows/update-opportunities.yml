name: Update Opportunities Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"

permissions:
  contents: write

concurrency:
  group: update-opportunities-snapshot
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Validate repository
        run: npm run validate

      - name: Build opportunities snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAX_ISSUES_PER_REPOSITORY: "30"
          MAX_REPOSITORIES: "0"
          REQUEST_DELAY_MS: "120"
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: production
          SENTRY_MONITOR_SLUG: opportunities-sync
          SENTRY_RELEASE: ${{ github.sha }}
        run: npm run build:snapshot

      - name: Submit shadow publications
        env:
          PUBLISHING_SHADOW_ENDPOINT: ${{ secrets.PUBLISHING_SHADOW_ENDPOINT }}
          PUBLISHING_CLIENT_ID: ${{ secrets.PUBLISHING_CLIENT_ID }}
          PUBLISHING_CLIENT_SECRET: ${{ secrets.PUBLISHING_CLIENT_SECRET }}
        run: npm run publish:shadow

      - name: Commit and push snapshot
        run: |
          if git diff --quiet -- snapshots/opportunities; then
            echo "No snapshot changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots/opportunities
          git add snapshots/publishing
          git add -u snapshots
          git commit -m "chore(data): refresh segmented opportunities snapshot"

          for push_attempt in 1 2 3; do
            if git push; then
              exit 0
            fi

            if [ "$push_attempt" -lt 3 ]; then
              echo "::warning::Snapshot push failed on attempt $push_attempt; retrying."
              sleep "$((push_attempt * 5))"
            fi
          done

          echo "::error::Snapshot push failed after 3 attempts."
          exit 1
